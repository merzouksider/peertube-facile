# PeerTube Facile - menu de démarrage (PC récents, mode UEFI)
set default=1
set timeout=30
set timeout_style=menu
insmod all_video
insmod gfxterm
terminal_output console

menuentry "Installer PeerTube Facile  (EFFACE TOUT LE DISQUE de ce PC)" {
	linux /install.amd/vmlinuz priority=critical locale=fr_FR.UTF-8 keymap=fr --- quiet
	initrd /install.amd/initrd.gz
}

menuentry "Ne rien installer : demarrer sur le disque du PC" {
	exit
}
