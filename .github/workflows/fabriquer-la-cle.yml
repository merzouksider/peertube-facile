name: Fabriquer la cle USB

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Outils
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso cpio unzip

      - name: Fabrication de l'image
        run: |
          # Le zip le plus récemment envoyé, quel que soit son nom
          ZIP="$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -n1)"
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Projet pris dans : $ZIP"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/projet"
            PROJET="$RUNNER_TEMP/projet/peertube-facile"
          else
            PROJET="$PWD"
          fi
          bash "$PROJET/construire/construire-iso.sh" "$PWD/sortie"

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO="$(ls sortie/peertube-facile-debian-*.iso)"
          VERSION="$(basename "$ISO" .iso | sed 's/peertube-facile-debian-//')"
          TAG="debian-$VERSION-$(git rev-parse --short HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version $TAG deja publiee."
            exit 0
          fi
          gh release create "$TAG" "$ISO" "$ISO.sha256" --latest \
            --title "PeerTube Facile (Debian $VERSION)" \
            --notes "Telecharge le fichier .iso puis copie-le sur une cle USB avec balenaEtcher (ou Rufus en mode DD)."
