#### PeerTube Facile - installation automatique de Debian
# Ce fichier répond à toutes les questions de l'installateur Debian.
# ATTENTION : le premier disque interne du PC est entièrement effacé.

### Langue, pays, clavier
d-i debian-installer/language string fr
d-i debian-installer/country string FR
d-i debian-installer/locale string fr_FR.UTF-8
d-i localechooser/supported-locales multiselect fr_FR.UTF-8
d-i keyboard-configuration/xkb-keymap select fr
d-i keyboard-configuration/layoutcode string fr

### Réseau (câble Ethernet, adresse donnée par la box)
d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 20
d-i netcfg/dhcp_timeout string 60
d-i netcfg/get_hostname string peertube
d-i netcfg/get_domain string
d-i netcfg/hostname string peertube
d-i hw-detect/load_firmware boolean true

### Miroir Debian
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Comptes : pas de connexion root, un compte « admin » de secours
# Le mot de passe provisoire est remplacé par un mot de passe aléatoire en fin
# d'installation (visible dans le tableau de bord de l'assistant).
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Administrateur PeerTube
d-i passwd/username string admin
d-i passwd/user-password password provisoire-peertube
d-i passwd/user-password-again password provisoire-peertube
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Heure
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean true

### Disque : tout le premier disque interne (choisi par early.sh)
d-i partman/early_command string sh /peertube-facile/early.sh
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/purge_lvm_from_device boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select uuid

### Logiciels
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean false
d-i apt-setup/contrib boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
tasksel tasksel/first multiselect standard
d-i pkgsel/include string ca-certificates curl gnupg python3 avahi-daemon libnss-mdns unattended-upgrades
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
unattended-upgrades unattended-upgrades/enable_auto_updates boolean true

### Démarrage
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

### Fin : installation de l'assistant PeerTube Facile
d-i preseed/late_command string sh /peertube-facile/late.sh
d-i cdrom-detect/eject boolean true
