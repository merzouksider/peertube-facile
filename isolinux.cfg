# PeerTube Facile - menu de démarrage (PC anciens, mode BIOS)
display message.txt
prompt 1
timeout 300
default disque

label install
  kernel /install.amd/vmlinuz
  append vga=788 initrd=/install.amd/initrd.gz priority=critical locale=fr_FR.UTF-8 keymap=fr --- quiet

label disque
  # -1 : rend la main au BIOS, qui démarre alors le périphérique suivant (le disque)
  localboot -1
